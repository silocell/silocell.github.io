<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework Launchpad - Interactive Dashboard</title>
    <style>
        :root {
            --bg-dark: #0b0b0c;
            --card-bg: #111113;
            --accent-blue: #2563eb;
            --accent-hover: #1d4ed8;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --border: #27272a;
            --success: #10b981;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 25px;
            box-sizing: border-box;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 1.6rem;
            margin: 0;
            letter-spacing: -0.02em;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .util-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .util-btn:hover {
            background-color: var(--border);
        }

        .workspace-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .workspace-grid {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        h3 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.1rem;
            color: #fff;
        }

        .search-container {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .input-field {
            flex-grow: 1;
            background-color: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: #fff;
            padding: 10px;
            font-size: 0.9rem;
            box-sizing: border-box;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .action-btn {
            background-color: var(--accent-blue);
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .action-btn:hover {
            background-color: var(--accent-hover);
        }

        .search-engines {
            display: flex;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
            align-items: center;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .word-display {
            font-size: 1.4rem;
            color: var(--success);
            font-weight: 700;
            margin: 5px 0;
        }

        .muted-caption {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 10px;
            margin-bottom: 0;
            line-height: 1.4;
        }
    </style>
</head>
<body id="appBody">

    <div class="dashboard-header">
        <div>
            <h1>Homework Launchpad</h1>
            <span style="font-size: 0.85rem; color: var(--text-muted);">Hello pupil</span>
        </div>
        <div class="header-actions">
            <button class="util-btn" id="themeToggle">Dark mode</button>
            <button class="util-btn" onclick="alert('Demo Mode: Session active.')">Switch user</button>
        </div>
    </div>

    <div class="workspace-grid">
        <!-- Main Panel Stack -->
        <div style="display: flex; flex-direction: column; gap: 20px;">
            
            <!-- Global Search Module -->
            <div class="panel">
                <h3>Everything in one place</h3>
                <div class="search-container">
                    <input type="text" class="input-field" placeholder="Search the web or lookup entries...">
                    <button class="action-btn">Search</button>
                </div>
                <div class="search-engines">
                    <label class="radio-label"><input type="radio" name="engine" checked> Google</label>
                    <label class="radio-label"><input type="radio" name="engine"> Bing</label>
                    <label class="radio-label"><input type="radio" name="engine"> DuckDuckGo</label>
                </div>
            </div>

            <!-- Task Board Module -->
            <div class="panel">
                <h3>To-do</h3>
                <div class="search-container">
                    <input type="text" id="todoInput" class="input-field" placeholder="Add a new task item...">
                    <button class="action-btn" id="addTodoBtn">+</button>
                </div>
                <div id="todoList">
                    <div class="todo-item">⏰ Year 7 Science Reading Homework</div>
                    <div class="todo-item">📝 Math Workbook Exercises Page 14</div>
                </div>
                <p class="muted-caption">Saved on this computer only — to-do items don't travel with the file.</p>
            </div>

        </div>

        <!-- Sidebar Widgets -->
        <div style="display: flex; flex-direction: column; gap: 20px;">
            
            <!-- Vocabulary Engine Widget -->
            <div class="panel">
                <h3>Word of the day</h3>
                <div class="word-display">—</div>
                <button class="util-btn" style="width: 100%; margin-top: 5px;">Define</button>
                <p class="muted-caption">Word of the day changes at midnight.</p>
            </div>

        </div>
    </div>

    <script>
        // Simple client side dark/light interface toggle simulation
        document.getElementById('themeToggle').addEventListener('click', () => {
            const body = document.getElementById('appBody');
            if (body.style.backgroundColor === 'rgb(244, 244, 245)') {
                body.style.backgroundColor = '#0b0b0c';
                body.style.color = '#f4f4f5';
                document.getElementById('themeToggle').textContent = 'Dark mode';
            } else {
                body.style.backgroundColor = '#f4f4f5';
                body.style.color = '#0b0b0c';
                document.getElementById('themeToggle').textContent = 'Light mode';
            }
        });

        // Simple runtime to-do appending simulation
        document.getElementById('addTodoBtn').addEventListener('click', () => {
            const input = document.getElementById('todoInput');
            if (input.value.trim() !== '') {
                const list = document.getElementById('todoList');
                const item = document.createElement('div');
                item.className = 'todo-item';
                item.textContent = input.value;
                list.appendChild(item);
                input.value = '';
            }
        });
    </script>
</body>
</html>
