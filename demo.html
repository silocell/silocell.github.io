<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework Launchpad</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; padding: 20px; }
        .box { border: 1px solid #333; padding: 15px; margin-bottom: 10px; background: #1a1a1a; border-radius: 6px; }
        input { padding: 8px; margin-right: 5px; background: #222; color: #fff; border: 1px solid #444; }
        button { padding: 8px 12px; background: #2563eb; color: #fff; border: none; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Homework Launchpad</h1>

    <div class="box">
        <button onclick="document.body.style.background = document.body.style.background === 'rgb(17, 17, 17)' ? '#222' : '#111'">Dark mode Switch user</button>
    </div>

    <div class="box">
        <h2>Hello</h2>
        <input type="radio" name="engine" id="google" checked> Google
        <input type="radio" name="engine" id="bing"> Bing
        <input type="radio" name="engine" id="duckduckgo"> DuckDuckGo
        <br><br>
        <input type="text" placeholder="Everything in one place">
        <button>Search</button>
    </div>

    <div class="box">
        <h3>Word of the day</h3>
        <p>—</p>
        <button>Define</button>
        <p style="font-size:0.85rem; color:#aaa;">Word of the day changes at midnight.</p>
    </div>

    <div class="box">
        <h3>To-do</h3>
        <input type="text" placeholder="Add a task...">
        <button>+</button>
        <p style="font-size:0.85rem; color:#aaa; margin-top:10px;">
            Saved on this computer only — to-do items don't travel with the file.
        </p>
    </div>
</body>
</html>
